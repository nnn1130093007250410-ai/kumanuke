name: 🐻 Weekly Bear Data Update

on:
  # 毎週日曜 15:00 UTC = 月曜 00:00 JST
  schedule:
    - cron: '0 15 * * 0'
  # 手動実行も可能
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: false
        default: 'full'
        type: choice
        options:
          - full          # データ収集 + 統計更新 + コミット
          - stats-only    # 統計更新のみ（データ収集なし）
          - discover      # データ収集 + 新規ソース探索 + 統計更新
          - dry-run       # テスト実行（ファイル書き込みなし）

jobs:
  update-bear-data:
    name: 熊出没データ更新
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write   # git push のために必要

    steps:
      # ── 1. チェックアウト ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python セットアップ ────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 追加ライブラリは標準ライブラリのみ使用のため pip install 不要

      # ── 3. データ収集・統計更新 ────────────────────────────────────────
      - name: Run data collection and stats update
        env:
          PYTHONIOENCODING: utf-8
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "実行モード: $MODE"

          case "$MODE" in
            full)
              python scripts/collect_arcgis.py
              python scripts/collect_kml.py
              python scripts/update_stats.py
              ;;
            stats-only)
              python scripts/update_stats.py
              ;;
            discover)
              python scripts/collect_arcgis.py
              python scripts/collect_kml.py
              python scripts/discover_sources.py
              python scripts/update_stats.py
              ;;
            dry-run)
              python scripts/collect_arcgis.py --dry-run
              python scripts/collect_kml.py --dry-run
              python scripts/update_stats.py
              ;;
          esac

      # ── 4. 変更確認 ───────────────────────────────────────────────────
      - name: Check for changes
        id: check_changes
        run: |
          git diff --stat
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # 件数の変化をログ出力
            TOTAL=$(python3 -c "
          import json
          with open('public/data/bear-japan.json') as f:
              data = json.load(f)
          print(len(data))
          ")
            echo "total_records=$TOTAL" >> $GITHUB_OUTPUT
            echo "総件数: $TOTAL"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "変更なし"
          fi

      # ── 5. コミット & プッシュ ────────────────────────────────────────
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.inputs.mode != 'dry-run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TOTAL="${{ steps.check_changes.outputs.total_records }}"
          DATE=$(date -u '+%Y-%m-%d')

          git add public/data/bear-japan.json
          git add src/app/page.tsx
          git add src/app/guide/japan-regional-bear-data/page.tsx
          git add src/app/guide/bear-incident-news-2026/page.tsx

          # candidates.json も追加（discover モードの場合）
          if [ -f scripts/candidates.json ]; then
            git add scripts/candidates.json
          fi

          git commit -m "🐻 自動更新: 熊出没データ ${TOTAL}件 (${DATE})

          - ArcGIS REST API 増分収集
          - Google My Maps KML 増分収集
          - 都道府県別統計・件数を自動更新

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin main

      # ── 6. サマリー ───────────────────────────────────────────────────
      - name: Job summary
        if: always()
        run: |
          echo "## 🐻 熊出没データ更新 サマリー" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **実行日時**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **モード**: ${{ github.event.inputs.mode || 'full (scheduled)' }}" >> $GITHUB_STEP_SUMMARY

          TOTAL=$(python3 -c "
          import json
          with open('public/data/bear-japan.json') as f: data = json.load(f)
          y26 = sum(1 for d in data if d.get('date','').startswith('2026'))
          print(f'総件数: {len(data):,}件 / 2026年: {y26:,}件')
          " 2>/dev/null || echo "取得エラー")

          echo "- **データ**: ${TOTAL}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_changes.outputs.has_changes }}" = "true" ]; then
            echo "- **ステータス**: ✅ データ更新・デプロイ済み" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **ステータス**: ℹ️ 新規データなし（変更なし）" >> $GITHUB_STEP_SUMMARY
          fi
